<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen · Servicio en el Ecosistema · Hoteles de Petén</title>
<style>
  :root{ --green:#1F6B4A; --dark:#143D2B; --moss:#97BC62; --tint:#EDF5F0; --gold:#C4942A; --ink:#26332C; --gray:#5A6B61; --red:#B0413E; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Segoe UI', Arial, sans-serif; background:var(--tint); color:var(--ink); min-height:100vh;}
  .wrap{max-width:760px; margin:0 auto; padding:16px;}
  header{background:var(--dark); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:10;}
  header .hwrap{max-width:760px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  header h1{font-size:15px; font-weight:600;}
  header .who{font-size:12px; color:#CFE5D8;}
  .progress{height:6px; background:#0e2e20; border-radius:3px; overflow:hidden; margin-top:8px;}
  .progress>div{height:100%; background:var(--gold); width:0%; transition:width .4s;}
  .card{background:#fff; border-radius:14px; padding:22px; margin:16px 0; box-shadow:0 2px 10px rgba(0,0,0,.08);}
  .card h2{color:var(--green); font-size:21px; margin-bottom:10px;}
  .card h3{color:var(--green); font-size:16px; margin:14px 0 6px;}
  .card p{font-size:15px; line-height:1.55; margin-bottom:10px;}
  .tag{display:inline-block; background:var(--tint); color:var(--green); font-size:12px; font-weight:700; padding:4px 12px; border-radius:20px; margin-bottom:10px;}
  .btn{display:inline-block; background:var(--green); color:#fff; border:none; font-size:16px; font-weight:600; padding:13px 26px; border-radius:10px; cursor:pointer; margin-top:8px;}
  .btn:active{transform:scale(.98);}
  .btn.sec{background:#fff; color:var(--green); border:2px solid var(--green);}
  .btn:disabled{opacity:.45; cursor:default;}
  .opt{display:block; width:100%; text-align:left; background:var(--tint); border:2px solid transparent; border-radius:10px; padding:13px 15px; font-size:15px; margin:8px 0; cursor:pointer; color:var(--ink);}
  .opt:hover{border-color:var(--moss);}
  .opt.ok{background:#E3F2E8; border-color:var(--green); font-weight:600;}
  .opt.bad{background:#F7E6E5; border-color:var(--red);}
  .opt:disabled{cursor:default;}
  .feedback{border-radius:10px; padding:12px 14px; font-size:14px; margin-top:10px; display:none;}
  .feedback.ok{background:#E3F2E8; color:var(--green); display:block;}
  .feedback.bad{background:#F7E6E5; color:var(--red); display:block;}
  .center{text-align:center;}
  .big{font-size:44px; font-weight:800; color:var(--green);}
  .cap{font-size:12px; color:var(--gray); text-transform:uppercase; letter-spacing:1px;}
  input[type=text]{width:100%; padding:12px 14px; font-size:15px; border:2px solid #DCE8E1; border-radius:10px; margin:6px 0 4px;}
  .logo{width:120px; height:auto; display:block; margin:0 auto 8px;}
  .logo-sm{width:64px; height:auto; display:block; margin:0 auto 6px;}
  .score-ok{color:var(--green); font-weight:700;} .score-mid{color:var(--gold); font-weight:700;} .score-low{color:var(--red); font-weight:700;}
  .quote{border-left:4px solid var(--gold); padding:10px 14px; font-style:italic; color:var(--gray); background:var(--tint); border-radius:0 10px 10px 0; margin:12px 0; font-size:14px;}
  .rev{font-size:14px; border-bottom:1px solid #e3ebe6; padding:8px 0;}
  .rev b{color:var(--green);}
  footer{text-align:center; font-size:12px; color:var(--gray); padding:18px 0 30px;}
</style>
</head>

const whoami=document.getElementById("whoami");
const WHATSAPP_TO="50242182300"; /* Opcional: pon el numero del coordinador con codigo de pais, ej "50212345678". Vacio = el usuario elige el contacto al enviar. */
const QUESTIONS=[
 { q:"En el ecosistema de Hoteles de Petén, dar servicio significa…",
   opts:["Hacer únicamente las tareas de mi puesto","Cumplir mi función sabiendo que hace posible el trabajo del siguiente y la experiencia del huésped","Atender solo cuando me lo piden","Resolver solo lo que me conviene"], ok:1,
   exp:"Servir en el ecosistema es entender que mi trabajo se conecta con el de los demás: cada acción suma o resta a la experiencia del huésped." },
 { q:"Un huésped te pregunta algo que no es de tu área. ¿Qué decisión aporta al ecosistema?",
   opts:["Decir \"ese no es mi trabajo\"","Ignorarlo y seguir con lo mío","Ayudarlo o acompañarlo con quien sí puede resolver","Mandarlo a que lo averigüe solo"], ok:2,
   exp:"Para el huésped no existen los departamentos. \"Ese no es mi trabajo\" rompe el ecosistema; acompañarlo a la solución lo fortalece." },
 { q:"Ama de llaves: mientras limpias, notas que el aire acondicionado no enfría. ¿Qué haces?",
   opts:["Nada, no es mi área","Lo reporto de inmediato a mantenimiento","Espero a que el huésped se queje","Cierro la puerta y no digo nada"], ok:1,
   exp:"Detectar y comunicar a tiempo evita una mala experiencia. Callar \"porque no es mi área\" le resta al ecosistema." },
 { q:"Recepción: un huésped llega de madrugada, cansado, y su habitación aún no está lista. La mejor decisión es…",
   opts:["Decirle que espere, sin más","Explicarle con calidez, ofrecerle un espacio para descansar y agilizar con ama de llaves","Culpar a camareras frente al huésped","Decirle que reclame en la mañana"], ok:1,
   exp:"Servir es anticipar y coordinar entre áreas con calidez. Culpar a otra área frente al huésped nunca aporta." },
 { q:"¿Cuál de estas actitudes NO aporta al ecosistema?",
   opts:["Comunicar a tiempo un problema","Buscar culpables en lugar de soluciones","Apoyar a un compañero de otra área","Anticiparse a la necesidad del huésped"], ok:1,
   exp:"Buscar culpables paraliza; el ecosistema crece cuando cada quien aporta soluciones." },
 { q:"Restaurante: un huésped dice que su plato llegó frío. ¿Qué decisión sirve mejor?",
   opts:["Discutir que sí estaba caliente","Disculparte, resolverlo de inmediato y ofrecer una solución","Decir que la cocina se tardó, no tú","Ignorar el comentario"], ok:1,
   exp:"El huésped no distingue quién falló: ve a Hoteles de Petén. Resolver con actitud, sin excusas ni echar culpas, es servir." },
 { q:"Piloto/Traslado: el vuelo se retrasó y el huésped llega estresado. Tu decisión ideal:",
   opts:["Recibirlo con calma, empatía y una bienvenida cálida","Hacerle ver que lo esperaste mucho tiempo","Manejar apurado para recuperar el tiempo","No saludar porque vienes cansado"], ok:0,
   exp:"El piloto crea la primera impresión. La empatía convierte un mal momento en una gran bienvenida." },
 { q:"Termina tu turno, pero un huésped todavía necesita ayuda. ¿Qué haces?",
   opts:["Me voy, ya cumplí mi horario","Lo atiendo o me aseguro de dejarlo en buenas manos antes de irme","Le digo que vuelva mañana","Le paso el problema a cualquiera sin explicar"], ok:1,
   exp:"El servicio no termina cuando acaba el turno; termina cuando el huésped queda bien atendido. Dejar todo a medias rompe la cadena." },
 { q:"Mantenimiento: ves una lámpara fundida en un pasillo que no es tu zona asignada. La mejor decisión:",
   opts:["Dejarla, no es mi zona","Resolverla o reportarla, porque todo el hotel es parte de la experiencia","Esperar la orden de un jefe","Avisar solo si alguien más lo nota"], ok:1,
   exp:"En un ecosistema no hay zonas ajenas: cada detalle suma a la experiencia del huésped." },
 { q:"Un compañero de otra área está saturado y te pide apoyo en un momento clave. ¿Qué aporta?",
   opts:["Decirle que no es tu problema","Apoyarlo si puedes, porque su éxito también es el tuyo","Hacer como que no escuchaste","Ayudar solo si te lo ordenan"], ok:1,
   exp:"Cuando una pieza mejora, todos ganan. Apoyarse entre áreas fortalece a todo el equipo." },
 { q:"Reservaciones: no estás seguro si hay disponibilidad para lo que pide el huésped. Lo correcto es…",
   opts:["Prometer que sí, para no perder la venta","Verificar y confirmar con información veraz antes de comprometer","Decir \"creo que sí\" sin revisar","Pasarle el problema a recepción"], ok:1,
   exp:"Prometer lo que no se puede cumplir genera una mala experiencia después. Servir es dar información veraz y coordinar bien." },
 { q:"¿Cuál es un ejemplo de trabajar solo por cumplir (que NO aporta)?",
   opts:["Hacer lo mínimo, sin interés por el huésped","Anticipar lo que el huésped necesita","Buscar mejorar mi área cada día","Recibir con una sonrisa"], ok:0,
   exp:"Trabajar solo por cumplir debe morir para que nazca la pasión por servir. El ecosistema se nutre de compromiso, no de mínimos." },
 { q:"Un huésped molesto te reclama algo que no fue tu culpa. La mejor decisión:",
   opts:["Defenderte y aclarar que no fuiste tú","Escuchar con empatía, disculparte a nombre del hotel y buscar la solución","Decirle que hable con otro","Restarle importancia a su molestia"], ok:1,
   exp:"El huésped ve a Hoteles de Petén, no a una persona. Escuchar, empatizar y resolver convierte una queja en una oportunidad." },
 { q:"Recibes una reserva con una nota especial: es el aniversario del huésped. ¿Qué decisión suma?",
   opts:["Ignorar la nota, no es indispensable","Compartirla con las áreas para preparar un detalle y sorprenderlo","Guardarla solo para mí","Comentarla cuando el huésped ya se fue"], ok:1,
   exp:"La comunicación entre áreas transforma un dato en una experiencia memorable. La falta de comunicación le resta al ecosistema." },
 { q:"En una frase, ¿cómo se construye el ecosistema de servicio?",
   opts:["Cuando cada quien hace solo su parte","Cuando cada quien entiende que su trabajo hace posible el del siguiente y cuida la experiencia del huésped","Cuando cada área compite con las demás","Cuando el huésped se adapta a nosotros"], ok:1,
   exp:"No somos departamentos separados; somos un ecosistema. El servicio se construye cuando todos conectan su trabajo con el del siguiente." },
];
const SHEETS_ENDPOINT="PEGA_AQUI_LA_URL_DEL_APPS_SCRIPT"; /* URL /exec del Web App de Google Apps Script */
let answersLog=[];
let idx=0, score=0, name="", answered=false;
const total=QUESTIONS.length;
function logToSheets(payload){
  if(!SHEETS_ENDPOINT || SHEETS_ENDPOINT.indexOf("PEGA_AQUI")===0) return;
  try{
    fetch(SHEETS_ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
  }catch(e){/* guardado silencioso, no interrumpe al participante */}
}
function setProgress(p){ bar.style.width=p+"%"; }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function intro(){
  setProgress(0);
  app.innerHTML=`
   <div class="card center">
     <img class="logo" src="${LOGO_SRC}" alt="Hoteles de Petén">
     <div class="tag">Servicio en el Ecosistema</div>
     <h2>Examen: El servicio dentro del ecosistema</h2>
     <p>Pon a prueba lo que sabes sobre el <b>servicio dentro del ecosistema de Hoteles de Petén</b>: las decisiones que cada colaborador toma al atender, y lo que <b>no</b> aporta. Son ${total} preguntas de escenario; al final verás tu resultado.</p>
     <input type="text" id="nm" placeholder="Escribe tu nombre (opcional)">
     <button class="btn" onclick="start()">Comenzar &#127807;</button>
   </div>`;
}
function start(){
  const el=document.getElementById("nm"); name=el && el.value.trim() ? el.value.trim() : "";
  whoami.textContent = name ? ("Participante: "+name) : "";
  idx=0; score=0; answersLog=[]; renderQ();
}
function renderQ(){
  answered=false;
  const it=QUESTIONS[idx];
  setProgress(Math.round(idx/total*100));
  let opts="";
  it.opts.forEach((o,oi)=>{ opts+=`<button class="opt" id="opt${oi}" onclick="answer(${oi})">${String.fromCharCode(65+oi)}. ${esc(o)}</button>`; });
  app.innerHTML=`
   <div class="card">
     <div class="tag">Pregunta ${idx+1} de ${total}</div>
     <h2>${esc(it.q)}</h2>
     ${opts}
     <div class="feedback" id="fb"></div>
     <div id="nextwrap" style="margin-top:6px"></div>
   </div>`;
}
function answer(oi){
  if(answered) return; answered=true;
  answersLog[idx]=String.fromCharCode(65+oi);
  const it=QUESTIONS[idx];
  for(let i=0;i<it.opts.length;i++){ const b=document.getElementById("opt"+i); b.disabled=true; if(i===it.ok) b.classList.add("ok"); }
  const fb=document.getElementById("fb");
  if(oi===it.ok){ score++; fb.className="feedback ok"; fb.innerHTML="&#9989; ¡Correcto! "+esc(it.exp); }
  else { document.getElementById("opt"+oi).classList.add("bad"); fb.className="feedback bad"; fb.innerHTML="&#10060; La respuesta que suma es <b>"+String.fromCharCode(65+it.ok)+"</b>. "+esc(it.exp); }
  const last = idx===total-1;
  document.getElementById("nextwrap").innerHTML=`<button class="btn" onclick="next()">${last?"Ver resultado &#127942;":"Siguiente &rarr;"}</button>`;
}
function next(){ idx++; if(idx<total) renderQ(); else result(); }
function result(){
  setProgress(100);
  const passed = score>=Math.ceil(total*0.7);
  logToSheets({
    hoja:"Fase 1",
    examen:"Fase 1 - Servicio en el Ecosistema",
    nombre:name||"(sin nombre)",
    punteo:score,
    total:total,
    nivel:passed?"Ecosistemista Certificado":"Ecosistemista en formacion",
    respuestas:answersLog
  });
  const filled = Math.round(score/total*5);
  const stars = "⭐".repeat(filled)+"☆".repeat(5-filled);
  const cls = passed?"score-ok":(score>=Math.ceil(total*0.5)?"score-mid":"score-low");
  const _msg = `Examen: Servicio en el Ecosistema - Hoteles de Petén
Participante: ${name||"(sin nombre)"}
Resultado: ${score}/${total} ${stars}
Nivel: ${passed?"Ecosistemista Certificado":"Ecosistemista en formación"}`;
  const _wa = "https://wa.me/"+WHATSAPP_TO+"?text="+encodeURIComponent(_msg);
  let review="";
  QUESTIONS.forEach((it,i)=>{ review+=`<div class="rev"><b>${i+1}.</b> ${esc(it.q)}<br>&#9989; ${esc(it.opts[it.ok])}</div>`; });
  app.innerHTML=`
   <div class="card center">
     <img class="logo-sm" src="${LOGO_SRC}" alt="Hoteles de Petén">
     <div class="cap">${name?esc(name)+" &middot; ":""}Resultado</div>
     <div class="big ${cls}">${score} / ${total}</div>
     <div style="font-size:32px;letter-spacing:5px;margin:2px 0 4px">${stars}</div>
     <h2>${passed?"⭐ Ecosistemista Certificado":"🌱 Ecosistemista en formación"}</h2>
     <p>${passed?"¡Excelente! Tomas decisiones que fortalecen el ecosistema y cuidas la experiencia del huésped.":"Vas por buen camino. Repasa el video y vuelve a intentarlo: cada decisión suma al ecosistema."}</p>
     <div class="quote">No somos departamentos trabajando por separado. Somos un ecosistema creando experiencias inolvidables.</div>
     <a class="btn" style="text-decoration:none;display:inline-block" href="${_wa}" target="_blank" rel="noopener">&#128242; Enviar mi resultado por WhatsApp</a>
     <div style="margin-top:10px"><button class="btn sec" onclick="intro()">Reiniciar para otro participante</button></div>
     <h3 style="margin-top:18px;text-align:left">Respuestas que suman</h3>
     <div style="text-align:left">${review}</div>
   </div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}
intro();
</script>
</body>
</html>
